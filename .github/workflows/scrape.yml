name: Daily scrape

on:
  schedule:
    # Targets 8:17 PM and 8:17 AM Phoenix (03:17 / 15:17 UTC). GitHub queues
    # scheduled runs behind everyone else's, and runs here have started 5–9
    # hours late; the off-the-hour minute avoids the worst of that queue, and
    # the scraper's 3-day window covers whatever delay remains.
    - cron: '17 3 * * *'
    - cron: '17 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # A healthy run takes well under a minute; don't let a hang burn 6 hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: node src/run.mjs

      # Only main publishes data. A manual run on another branch still scrapes
      # and checks every source, but leaves the published data alone.
      - name: Commit and push results
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "jobs-digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data docs/xlsx docs/status.json
          if git diff --cached --quiet; then
            echo "No new postings — nothing to commit."
            exit 0
          fi
          git commit -m "data: scrape $(date -u +%Y-%m-%dT%H:%MZ)"
          # Someone may push to main while this runs; rebase and retry.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push attempt $attempt failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          echo "Could not push results after 3 attempts"
          exit 1

      # Data is already committed above; this step only makes the run show red
      # (and email the repo owner) when one of the scrapers broke.
      - name: Fail loud if any source failed
        run: |
          node -e '
            const s = JSON.parse(require("fs").readFileSync("docs/status.json", "utf8"));
            const bad = Object.entries(s.sources).filter(([, v]) => !v.ok);
            if (bad.length) {
              console.error("Broken sources:", bad.map(([k, v]) => `${k}: ${v.error}`).join(" | "));
              process.exit(1);
            }
            console.log("All sources OK.");
          '
