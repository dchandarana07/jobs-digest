name: Daily scrape

on:
  schedule:
    # 03:00 UTC = 8:00 PM Phoenix (main end-of-day run)
    - cron: '0 3 * * *'
    # 15:00 UTC = 8:00 AM Phoenix (catch-up for late postings from yesterday)
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: node src/run.mjs

      - name: Commit and push results
        run: |
          git config user.name "jobs-digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data docs/xlsx docs/status.json
          if git diff --cached --quiet; then
            echo "No new postings — nothing to commit."
          else
            git commit -m "data: scrape $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push origin main
          fi
